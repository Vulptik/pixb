name: CI

# Runs on every pull request and push to main. The release workflow calls it again on a version tag
# before publishing anything.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pixb:pixb@localhost:5432/pixb?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build and verify the PostgreSQL image
        run: |
          docker build -f docker/postgres.Dockerfile -t pixb-postgres:local .
          node scripts/check-postgres-image.mjs

      - name: Start PostgreSQL
        run: |
          docker run -d --name pixb-ci-db \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=pixb --env POSTGRES_PASSWORD=pixb --env POSTGRES_DB=pixb \
            --health-cmd='pg_isready -h 127.0.0.1 -U pixb -d pixb' \
            --health-interval=2s --health-timeout=5s --health-retries=30 \
            pixb-postgres:local
          timeout 90s bash -c 'until [ "$(docker inspect --format "{{.State.Health.Status}}" pixb-ci-db)" = healthy ]; do sleep 1; done'

      - name: Apply the database schema
        run: npm run db:init

      - name: Check schema constraints and library query plans
        run: npm run db:check

      - name: Tests with the 90% coverage gate
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
