name: Release

# Push a tag such as v1.0.0 to release. The tag must match package.json. CI runs again on the tag,
# then the app and database images are published to GitHub Container Registry as 1.0.0 and latest,
# with build provenance attached, and a draft GitHub release waits for its notes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  PLATFORMS: linux/amd64

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Release tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
          # The Compose template attached to the release must install this exact version.
          if ! grep -qF "ghcr.io/vulptik/pixb:\${PIXB_VERSION:-$VERSION}}" compose.production.yml; then
            echo "::error::compose.production.yml does not default PIXB_VERSION to $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  images:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Image names
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "IMAGE_NAME=ghcr.io/${OWNER,,}/pixb" >> "$GITHUB_ENV"
          echo "DATABASE_IMAGE_NAME=ghcr.io/${OWNER,,}/pixb-postgres" >> "$GITHUB_ENV"
          echo "CACHE_IMAGE=ghcr.io/${OWNER,,}/pixb-buildcache" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the database image
        run: |
          docker buildx build \
            --file docker/postgres.Dockerfile \
            --platform "$PLATFORMS" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${DATABASE_IMAGE_NAME}:${VERSION}" \
            --tag "${DATABASE_IMAGE_NAME}:latest" \
            --cache-from type=registry,ref="${CACHE_IMAGE}:postgres" \
            --cache-to type=registry,ref="${CACHE_IMAGE}:postgres",mode=max \
            --metadata-file database-metadata.json \
            --push \
            .
          echo "DATABASE_DIGEST=$(jq -r '."containerimage.digest"' database-metadata.json)" >> "$GITHUB_ENV"

      - name: Build and push the app image
        run: |
          docker buildx build \
            --target runner \
            --platform "$PLATFORMS" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label 'org.opencontainers.image.licenses=AGPL-3.0-only' \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            --cache-from type=registry,ref="${CACHE_IMAGE}:main" \
            --cache-to type=registry,ref="${CACHE_IMAGE}:main",mode=max \
            --metadata-file app-metadata.json \
            --push \
            .
          echo "APP_DIGEST=$(jq -r '."containerimage.digest"' app-metadata.json)" >> "$GITHUB_ENV"

      - name: Attest where the database image was built
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.DATABASE_IMAGE_NAME }}
          subject-digest: ${{ env.DATABASE_DIGEST }}
          push-to-registry: true

      - name: Attest where the app image was built
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.APP_DIGEST }}
          push-to-registry: true

      # A draft stays hidden until the maintainer writes the notes and publishes it. The install
      # files are attached so a server needs no checkout (GitHub renames files that start with a dot,
      # so the environment template ships as env.example).
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp .env.example env.example
          gh release create "$TAG" compose.production.yml env.example \
            --draft --verify-tag --title "PixB $VERSION" --notes "$(cat <<EOF
          Write the release notes for $VERSION here before publishing.

          Images:
          - \`${IMAGE_NAME}:${VERSION}\` (\`${APP_DIGEST}\`)
          - \`${DATABASE_IMAGE_NAME}:${VERSION}\` (\`${DATABASE_DIGEST}\`)
          EOF
          )"
